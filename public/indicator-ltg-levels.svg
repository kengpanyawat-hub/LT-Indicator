<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#0A0A0A"/>
  <rect x="20" y="20" width="560" height="360" fill="#151515" rx="8"/>

  <!-- Support/Resistance Levels -->
  <line x1="80" y1="100" x2="520" y2="100" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="80" y1="150" x2="520" y2="150" stroke="#22C55E" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="80" y1="200" x2="520" y2="200" stroke="#D61F2A" stroke-width="3"/>
  <line x1="80" y1="250" x2="520" y2="250" stroke="#22C55E" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="80" y1="300" x2="520" y2="300" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Price action -->
  <path d="M 100 200 L 150 180 L 200 220 L 250 160 L 300 190 L 350 150 L 400 170 L 450 140 L 500 160"
        stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.8"/>

  <text x="300" y="200" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#3B82F6" text-anchor="middle">
    LTG LEVELS
  </text>
</svg>
